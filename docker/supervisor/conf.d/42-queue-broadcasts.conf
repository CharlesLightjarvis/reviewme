; Dedicated worker for the "broadcasts" queue (Reverb notifications).
; Kept separate from 40-queue.conf so a slow/failing mail job never
; delays real-time broadcasts — this worker only ever does broadcast jobs.
[program:reviewme-queue-broadcasts]
command      = php /var/www/html/artisan queue:work --queue=broadcasts --sleep=1 --tries=3 --max-time=3600 --memory=256
directory    = /var/www/html
user         = www-data
priority     = 42
autostart    = true
autorestart  = true
numprocs     = 1
process_name = %(program_name)s_%(process_num)02d
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stopwaitsecs = 30
stopsignal   = SIGTERM
